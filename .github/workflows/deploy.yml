name: Deploy demo to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Gate the deploy on the conversion core tests, so a parser regression
      # cannot reach the published site.
      - name: Test
        # Target the test project rather than the solution: CaptionConverter.Ui
        # targets net10.0-windows and cannot build on the Linux runner.
        run: dotnet test tests/CaptionConverter.Tests/CaptionConverter.Tests.csproj -c Release

      - name: Publish Blazor WebAssembly
        run: dotnet publish src/CaptionConverter.Web/CaptionConverter.Web.csproj -c Release -o publish

      # GitHub Pages serves a project site from /<repo>/, so the published
      # base href has to match or every asset URL 404s.
      - name: Point the app at the Pages subpath
        run: node tools/set-base-href.mjs publish/wwwroot/index.html /${{ github.event.repository.name }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      # The smoke job polls this URL, so a CDN propagation failure fails
      # the workflow instead of surfacing an hour later.
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # A plain HTTP 200 on index.html proves nothing about a Pages deploy:
  # while the CDN propagates, different edges can serve 200 and 503 at
  # the same time. This job drives a real headless Chrome over the
  # DevTools protocol and waits until the Blazor app has actually
  # rendered its sample buttons, inside a bounded timeout.
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22 is the first LTS with a global WebSocket, which the
      # CDP driver uses to talk to Chrome.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Smoke test the live site
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: node tools/smoke.mjs "$PAGE_URL"
        timeout-minutes: 5
