name: Deploy demo to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Gate the deploy on the conversion core tests, so a parser regression
      # cannot reach the published site.
      - name: Test
        run: dotnet test CaptionConverter.sln -c Release

      - name: Publish Blazor WebAssembly
        run: dotnet publish src/CaptionConverter.Web/CaptionConverter.Web.csproj -c Release -o publish

      # GitHub Pages serves a project site from /<repo>/, so the published
      # base href has to match or every asset URL 404s.
      - name: Point the app at the Pages subpath
        run: node tools/set-base-href.mjs publish/wwwroot/index.html /${{ github.event.repository.name }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

